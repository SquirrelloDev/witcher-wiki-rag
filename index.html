<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encyklopedia Wiedźmina</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <header class="bg-gray-800 p-4 shadow-md text-center border-b border-gray-700 flex flex-col items-center justify-center">
        <h1 class="text-2xl font-bold text-yellow-500 mb-3">Encyklopedia wiedźmina</h1>

        <div class="flex items-center justify-center space-x-3 bg-gray-900 px-4 py-2 rounded-lg border border-gray-700">
            <span class="text-sm font-medium text-red-400" id="label-raw">Surowy Model</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="rag-toggle" class="sr-only peer" checked onchange="updateToggleLabels()">
                <div class="w-11 h-6 bg-red-900 peer-focus:outline-none rounded-full peer
                            peer-checked:after:translate-x-full peer-checked:after:border-white
                            after:content-[''] after:absolute after:top-[2px] after:left-[2px]
                            after:bg-white after:border-gray-300 after:border after:rounded-full
                            after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
            </label>
            <span class="text-sm font-bold text-green-400" id="label-rag">Aktywny RAG</span>
        </div>
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl mx-auto w-full">
        <div class="bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-700 w-3/4">
            <p class="text-sm font-semibold text-yellow-500 mb-1">System</p>
            <p>Witaj na Szlaku. Użyj przełącznika u góry, aby przetestować odpowiedzi modelu z podłączoną bazą wiedzy oraz bez niej. Następnie zadaj mi pytanie</p>
        </div>
    </main>

    <footer class="bg-gray-800 p-4 shadow-inner border-t border-gray-700">
        <div class="max-w-4xl mx-auto flex gap-4">
            <input type="text" id="user-input"
                class="flex-1 bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-500 border border-gray-600"
                placeholder="Zadaj pytanie..."
                onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()"
                class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 px-6 rounded-lg transition-colors">
                Zapytaj
            </button>
        </div>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const ragToggle = document.getElementById('rag-toggle');
        const labelRaw = document.getElementById('label-raw');
        const labelRag = document.getElementById('label-rag');

        function updateToggleLabels() {
            if(ragToggle.checked) {
                labelRag.classList.add('font-bold', 'text-green-400');
                labelRag.classList.remove('text-gray-500');
                labelRaw.classList.remove('font-bold', 'text-red-400');
                labelRaw.classList.add('text-gray-500');
            } else {
                labelRaw.classList.add('font-bold', 'text-red-400');
                labelRaw.classList.remove('text-gray-500');
                labelRag.classList.remove('font-bold', 'text-green-400');
                labelRag.classList.add('text-gray-500');
            }
        }

        updateToggleLabels();

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('Ty', text, 'bg-blue-900 border-blue-700 ml-auto text-blue-100');
            userInput.value = '';

            sendBtn.disabled = true;
            sendBtn.innerText = "Szukam...";

            const isRagEnabled = ragToggle.checked;
            const apiEndpoint = isRagEnabled ? 'http://127.0.0.1:8000/ask' : 'http://127.0.0.1:8000/ask_raw';

            const botName = isRagEnabled ? 'RAG' : 'Surowy Model';
            const bubbleColor = 'bg-gray-800 mr-auto';

            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: text })
                });

                if (!response.ok) throw new Error("Błąd sieci");

                const data = await response.json();

                let responseHTML = `<p class="leading-relaxed">${data.odpowiedz.replace(/\n/g, '<br>')}</p>`;

                if (data.znalezione_zrodla && data.znalezione_zrodla.length > 0) {
                    const zrodla = [...new Set(data.znalezione_zrodla)].join(', ');
                    const textColor = isRagEnabled ? 'text-green-400' : 'text-red-400';
                    responseHTML += `<div class="mt-3 pt-2 border-t border-gray-600 text-xs">
                                        <strong>Źródła:</strong> ${zrodla}
                                      </div>`;
                }

                appendMessage(botName, responseHTML, bubbleColor, true);

            } catch (error) {
                appendMessage('System', 'Wystąpił błąd podczas łączenia z backendem.', 'bg-red-900 border-red-700 ml-auto mr-auto text-center w-full');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = "Zapytaj";
            }
        }

        function appendMessage(sender, text, classes, isHTML = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-4 rounded-lg shadow-sm border w-3/4 ${classes}`;

            const title = document.createElement('p');
            let titleColor = 'text-gray-300';
            if(sender === 'Ty') titleColor = 'text-blue-300';
            else titleColor = 'text-yellow-500';

            title.className = `text-xs uppercase tracking-wider font-bold mb-2 ${titleColor}`;
            title.innerText = sender;

            const content = document.createElement('div');
            if (isHTML) content.innerHTML = text;
            else content.innerText = text;

            msgDiv.appendChild(title);
            msgDiv.appendChild(content);
            chatBox.appendChild(msgDiv);

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
